# The body of the http block both profiles share: nginx.conf (full) and static.conf (static).
include /etc/nginx/mime.types;
default_type application/octet-stream;

sendfile on;
tcp_nopush on;
keepalive_timeout 65;
# Every temporary path is under /tmp, the one path a read-only root lets nginx write; nginx
# makes each at start, the FastCGI one included, whether or not a location uses it.
client_body_temp_path /tmp/client_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
proxy_temp_path /tmp/proxy_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

access_log /dev/stdout;
error_log /dev/stderr warn;

# When a clean URL ends with a slash, look for a same-name landing file
# inside that directory, for example /en/experience/experience.html.
map $uri $directory_landing_html {
  default "";
  ~^(?<prefix>.*/)?(?<name>[^/]+)/$ /$prefix$name/$name.html;
}

# Serve the localized 404 page that matches the current language prefix.
map $uri $not_found_page {
  default /404.html;
  ~^/en(?:/|$) /en/404.html;
  ~^/fr(?:/|$) /fr/404.html;
}

# The static profile: the built site alone, with no upstream. Its image holds no PHP page, so a
# PHP path finds nothing and answers the localized 404.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/http.conf;

  server {
    include /etc/nginx/server.conf;
  }
}
